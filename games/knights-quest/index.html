<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Knight's Quest — Infinity Studio</title>
<link rel="icon" href="assets/icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@500;700;800&display=swap');
  :root{
    --gold:#E8C547; --gold2:#F5E6A3; --blood:#B91C1C; --ink:#07060C; --steel:#94A3B8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    height:100%;height:100dvh;max-height:100dvh;margin:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    background:
      radial-gradient(ellipse at 50% 0%,#2a1a0a 0%,transparent 45%),
      radial-gradient(ellipse at 80% 80%,#1a0a12 0%,transparent 40%),
      #050508;
    font-family:Outfit,system-ui,sans-serif;overflow:auto;overscroll-behavior:contain;color:#fff;
    padding:0;touch-action:pan-y;
  }
  html{height:100%;height:100dvh}
  #stage{
    flex:1 1 auto;width:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:52px 8px 8px;box-sizing:border-box;
  }
  canvas{
    display:block;border-radius:12px;
    box-shadow:0 0 0 1px rgba(232,197,71,.35),0 0 0 3px rgba(0,0,0,.8),0 16px 40px rgba(0,0,0,.55);
    max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none;cursor:crosshair;
  }
  #hud{
    position:fixed;top:0;left:0;right:0;width:100%;max-width:100vw;
    padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;z-index:5;pointer-events:none;
    background:linear-gradient(180deg,rgba(5,5,8,.92),rgba(5,5,8,.55) 70%,transparent);
  }
  .pill{
    background:linear-gradient(180deg,rgba(20,14,8,.92),rgba(8,6,12,.88));
    border:1px solid rgba(232,197,71,.4);border-radius:999px;padding:5px 10px;
    font-size:11px;font-weight:800;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    white-space:nowrap;
  }
  #muteBtn,#fsBtn{appearance:none}
  .pill.gold{color:var(--gold)}
  .pill.blood{color:#fca5a5}
  #bars{display:flex;flex-direction:column;gap:3px;min-width:100px;flex:1 1 120px;max-width:200px}
  .bar{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .bar>i{display:block;height:100%;width:100%;border-radius:99px;transition:width .25s}
  #hpFill{background:linear-gradient(90deg,#7f1d1d,#ef4444,#fbbf24)}
  #feverFill{background:linear-gradient(90deg,#92400e,#E8C547,#fff7ed)}
  #hud-right{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;align-items:center}
  #toast{
    position:fixed;top:48px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;
    pointer-events:none;z-index:8;font-family:Cinzel,serif;font-weight:900;font-size:clamp(16px,5vw,26px);
    letter-spacing:.06em;text-shadow:0 0 20px rgba(232,197,71,.8),0 4px 0 #000;transition:opacity .2s,transform .2s;
    max-width:92vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:520px){
    #hud{padding:4px 6px;padding-top:max(4px,env(safe-area-inset-top))}
    .pill{font-size:10px;padding:4px 8px}
    #stage{padding-top:64px}
  }
  #load{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1a1008,#050508 70%);z-index:30;gap:16px
  }
  #load.hide{opacity:0;pointer-events:none;transition:opacity .45s}
  #load img{width:96px;height:96px;filter:drop-shadow(0 0 24px rgba(232,197,71,.45))}
  #load-bar{width:min(280px,70vw);height:10px;background:#1c1410;border-radius:99px;overflow:hidden;border:1px solid rgba(232,197,71,.35)}
  #load-fill{height:100%;width:0;background:linear-gradient(90deg,#92400e,var(--gold),#fff7ed);transition:width .12s}
</style>
</head>
<body>
<div id="load">
  <img src="assets/icon.png" alt="" onerror="this.style.display='none'">
  <div style="font-family:Cinzel,serif;font-size:22px;letter-spacing:.12em;color:var(--gold)">KNIGHT'S QUEST</div>
  <div id="load-bar"><div id="load-fill"></div></div>
  <div id="load-txt" style="font-size:12px;opacity:.7">Forjando el arsenal teutónico…</div>
  <div id="build-tag" style="font-size:10px;opacity:.45;letter-spacing:.08em;margin-top:4px">hub38-kq1</div>
</div>
<div id="hud">
  <div class="pill"><span id="scoreVal">0</span> XP · BEST <span id="bestVal">0</span></div>
  <div id="bars">
    <div class="bar" title="HP"><i id="hpFill"></i></div>
    <div class="bar" title="Fever"><i id="feverFill" style="width:0%"></i></div>
  </div>
  <div id="hud-right">
    <button type="button" id="fsBtn" class="pill" style="pointer-events:auto;cursor:pointer;font:inherit;color:var(--gold)">PANTALLA</button>
    <button type="button" id="muteBtn" class="pill" style="pointer-events:auto;cursor:pointer;font:inherit;color:var(--gold)">SONIDO</button>
    <div class="pill gold">×<span id="multVal">1</span> · <span id="streakVal">0</span></div>
    <div class="pill blood">HP <span id="hpVal">3</span></div>
  </div>
</div>
<div id="toast"></div>
<div id="stage"><canvas id="c"></canvas></div>
<script src="../_shared/infinity-quiz-bank.js?v=q4"></script>
<script src="../_shared/infinity-arcade-run.js?v=r2"></script>
<script>
(async function () {
  const KQ_BUILD = 'hub38-kq1';
  const Run = window.InfinityArcadeRun;
  let resumeFrom = null;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  // Canvas forbids negative radii — a bad particle/FX must NEVER throw and kill the play loop.
  const _arc = CanvasRenderingContext2D.prototype.arc;
  CanvasRenderingContext2D.prototype.arc = function (x, y, r, ...rest) {
    return _arc.call(this, x, y, Math.max(0.1, Math.abs(+r || 0)), ...rest);
  };
  const _ellipse = CanvasRenderingContext2D.prototype.ellipse;
  if (_ellipse) {
    CanvasRenderingContext2D.prototype.ellipse = function (x, y, rx, ry, ...rest) {
      return _ellipse.call(
        this,
        x,
        y,
        Math.max(0.1, Math.abs(+rx || 0)),
        Math.max(0.1, Math.abs(+ry || 0)),
        ...rest
      );
    };
  }
  const loadFill = document.getElementById('load-fill');
  const loadTxt = document.getElementById('load-txt');
  const toastEl = document.getElementById('toast');
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const stage = document.getElementById('stage');
    const padX = 16;
    const padY = 8;
    const hudH = Math.max(48, (document.getElementById('hud')?.offsetHeight || 48) + 8);
    const availW = Math.max(280, Math.min((stage?.clientWidth || window.innerWidth) - padX, window.innerWidth - padX));
    const availH = Math.max(180, Math.min((stage?.clientHeight || window.innerHeight) - padY, window.innerHeight - hudH - padY));
    let cssW = availW;
    let cssH = Math.round(cssW * 0.5625);
    if (cssH > availH) {
      cssH = availH;
      cssW = Math.round(cssH / 0.5625);
    }
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () {
    setTimeout(resize, 120);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resize);
  }
  const W = () => Math.max(1, canvas.clientWidth || 0);
  const H = () => Math.max(1, canvas.clientHeight || 0);

  // ── LOAD ASSETS ──
  const manifest = await fetch('assets/manifest.json').then((r) => r.json());
  const FRAME = manifest.frame;
  const ANIMS = {};
  const imgs = {};
  const vfxImgs = {};

  let loaded = 0;
  const animKeys = Object.keys(manifest.anims);
  const vfxKeys = Object.keys(manifest.vfx || {});
  let total = animKeys.length;
  vfxKeys.forEach((k) => (total += manifest.vfx[k].frames || 0));

  function tickLoad(label) {
    loaded++;
    loadFill.style.width = Math.min(100, (loaded / total) * 100) + '%';
    if (label) loadTxt.textContent = label;
  }

  await Promise.all(
    animKeys.map(
      (key) =>
        new Promise((res, rej) => {
          const meta = manifest.anims[key];
          ANIMS[key] = { frames: meta.frames, fps: meta.fps || 12 };
          const img = new Image();
          img.onload = () => {
            imgs[key] = img;
            tickLoad(key);
            res();
          };
          img.onerror = () => {
            tickLoad('skip ' + key);
            res();
          };
          img.src = meta.file + '?v=full3';
        })
    )
  );

  for (const key of vfxKeys) {
    const meta = manifest.vfx[key];
    vfxImgs[key] = [];
    for (let i = 0; i < meta.frames; i++) {
      await new Promise((res) => {
        const img = new Image();
        img.onload = () => {
          vfxImgs[key].push(img);
          tickLoad(key);
          res();
        };
        img.onerror = () => {
          tickLoad(key);
          res();
        };
        img.src = meta.path + '/' + i + '.png?v=full3';
      });
    }
  }

  const cardImg = new Image();
  cardImg.src = 'assets/card.png';

  // Kenney Pixel Adventure UI (CC0) — parchment scroll + red ribbons
  const ui = {};
  const UI_MAP = {
    parch: 'tile_0000.png',
    parchFancy: 'tile_0006.png',
    ribbonL: 'tile_0043.png',
    ribbonM: 'tile_0044.png',
    ribbonR: 'tile_0045.png',
    bannerL: 'tile_0056.png',
    bannerM: 'tile_0057.png',
    bannerR: 'tile_0058.png',
    btnL: 'tile_0069.png',
    btnM: 'tile_0070.png',
    btnR: 'tile_0071.png'
  };
  loadTxt.textContent = 'Desplegando pergaminos…';
  await Promise.all(
    Object.keys(UI_MAP).map(
      (key) =>
        new Promise((res) => {
          const img = new Image();
          img.onload = () => {
            ui[key] = img;
            res();
          };
          img.onerror = () => res();
          img.src = 'assets/ui/' + UI_MAP[key] + '?v=ui3';
        })
    )
  );

  // Skeleton Chibi enemies (Segel2D) — idle / attack / hurt / dead
  const ENEMY_SKELS = ['skel01', 'skel02', 'skel03'];
  const ENEMY_ANIMS = ['idle', 'attack', 'hurt', 'dead'];
  const ENEMY_FRAMES = 8;
  const enemyImgs = {};
  loadTxt.textContent = 'Invocando esqueletos chibi…';
  await Promise.all(
    ENEMY_SKELS.flatMap((skel) => {
      enemyImgs[skel] = {};
      return ENEMY_ANIMS.map(
        (anim) =>
          new Promise((res) => {
            const frames = [];
            let left = ENEMY_FRAMES;
            for (let i = 0; i < ENEMY_FRAMES; i++) {
              const img = new Image();
              img.onload = img.onerror = () => {
                left--;
                if (left <= 0) {
                  enemyImgs[skel][anim] = frames;
                  res();
                }
              };
              img.src = 'assets/enemies/' + skel + '/' + anim + '/' + i + '.png?v=skel3';
              frames[i] = img;
            }
          })
      );
    })
  );

  // Prefetch SFX WAVs
  const SFX_NAMES = [
    'slash', 'hit', 'heavy', 'fireball', 'explode', 'ok', 'perfect', 'bad',
    'fever', 'boss', 'win', 'lose', 'tick', 'tickUrgent', 'hoof', 'click', 'start', 'ambient'
  ];
  const sfxRaw = {};
  loadTxt.textContent = 'Cargando sonidos de combate…';
  await Promise.all(
    SFX_NAMES.map(async (name) => {
      try {
        const res = await fetch('assets/sfx/' + name + '.wav?v=sfx4');
        if (res.ok) sfxRaw[name] = await res.arrayBuffer();
      } catch (_) {}
      tickLoad(name);
    })
  );

  console.info('[KQ]', KQ_BUILD);
  document.getElementById('load').classList.add('hide');
  setTimeout(() => document.getElementById('load')?.remove(), 500);

  // ── AUDIO ENGINE (WAV samples + fallback) ──
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let actx = null;
  let master = null;
  let muted = false; // never boot silent — mute is a button, not a stuck flag
  let ambientSrc = null;
  let ambientGain = null;
  let lastTickSec = -1;
  const sfxBuf = {};
  let sfxReady = false;

  let sfxLoadPromise = null;
  async function ensureAudio() {
    if (!actx) {
      actx = new AudioCtx();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') {
      try {
        await actx.resume();
      } catch (_) {}
    }
    if (!sfxReady) {
      if (!sfxLoadPromise) {
        sfxLoadPromise = Promise.all(
          Object.keys(sfxRaw).map(async (name) => {
            try {
              sfxBuf[name] = await actx.decodeAudioData(sfxRaw[name].slice(0));
            } catch (_) {}
          })
        ).then(() => {
          sfxReady = true;
        });
      }
      try {
        await sfxLoadPromise;
      } catch (_) {
        sfxReady = true;
      }
    }
    return actx;
  }

  function setMuted(m) {
    muted = !!m;
    localStorage.setItem('kq_mute', muted ? '1' : '0');
    if (master) master.gain.value = muted ? 0 : 0.9;
    if (ambientGain) ambientGain.gain.value = muted ? 0 : 0.22;
    const b = document.getElementById('muteBtn');
    if (b) b.textContent = muted ? 'SONIDO OFF' : 'SONIDO ON';
  }

  function playBuf(name, opts) {
    const buf = sfxBuf[name];
    if (!buf || !actx || !master) return false;
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.loop = !!(opts && opts.loop);
    const g = actx.createGain();
    g.gain.value = (opts && opts.gain != null ? opts.gain : 1) * (muted ? 0 : 1);
    src.connect(g);
    g.connect(master);
    src.start();
    if (opts && opts.loop) return { src, g };
    return true;
  }

  function startAmbient() {
    if (ambientSrc || muted) return;
    const looped = playBuf('ambient', { loop: true, gain: 0.22 });
    if (looped && looped.src) {
      ambientSrc = looped.src;
      ambientGain = looped.g;
      return;
    }
    // procedural bed if WAV missing (same idea as Thief)
    if (!actx || !master) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = 55;
    g.gain.value = 0.04;
    o.connect(g);
    g.connect(master);
    o.start(t0);
    ambientSrc = o;
    ambientGain = g;
  }

  function tone(freq, dur, type, gain, slideTo) {
    if (!actx || !master || muted) return;
    const t0 = actx.currentTime;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.12, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  }

  function noiseBurst(dur, gain, hpFreq) {
    if (!actx || !master || muted) return;
    const n = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = actx.createBufferSource();
    src.buffer = buf;
    const g = actx.createGain();
    const f = actx.createBiquadFilter();
    f.type = 'highpass';
    f.frequency.value = hpFreq || 400;
    g.gain.value = gain || 0.08;
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start();
  }

  function sfxFallback(kind) {
    if (kind === 'slash' || kind === 'hit') {
      noiseBurst(0.1, 0.12, 250);
      tone(160, 0.1, 'triangle', 0.08, 70);
    } else if (kind === 'heavy' || kind === 'explode') {
      noiseBurst(0.18, 0.14, 120);
      tone(90, 0.22, 'sawtooth', 0.08, 40);
    } else if (kind === 'fireball') {
      noiseBurst(0.16, 0.1, 400);
      tone(280, 0.2, 'sawtooth', 0.07, 90);
    } else if (kind === 'ok') {
      tone(440, 0.08, 'triangle', 0.08);
      tone(660, 0.1, 'sine', 0.05);
    } else if (kind === 'perfect') {
      tone(523, 0.08, 'triangle', 0.09);
      tone(784, 0.12, 'sine', 0.07);
      tone(1046, 0.14, 'sine', 0.05);
    } else if (kind === 'bad') {
      tone(180, 0.2, 'sawtooth', 0.08, 90);
      noiseBurst(0.15, 0.07, 200);
    } else if (kind === 'fever') {
      tone(220, 0.25, 'sine', 0.08, 440);
      tone(330, 0.3, 'triangle', 0.05, 660);
    } else if (kind === 'boss') {
      tone(80, 0.35, 'sawtooth', 0.09);
      tone(160, 0.25, 'square', 0.05);
    } else if (kind === 'win') {
      [440, 554, 659, 880].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.08), i * 90));
    } else if (kind === 'lose') {
      tone(300, 0.35, 'sawtooth', 0.07, 80);
      setTimeout(() => tone(160, 0.4, 'triangle', 0.05, 60), 120);
    } else if (kind === 'tick') {
      tone(720, 0.03, 'square', 0.04);
    } else if (kind === 'tickUrgent') {
      tone(980, 0.04, 'square', 0.06);
    } else if (kind === 'hoof') {
      tone(90, 0.06, 'triangle', 0.06);
      noiseBurst(0.05, 0.05, 80);
    } else if (kind === 'click') {
      tone(880, 0.04, 'square', 0.05);
    } else if (kind === 'start') {
      tone(200, 0.2, 'sine', 0.08, 500);
      noiseBurst(0.2, 0.06, 500);
    } else {
      tone(500, 0.06, 'sine', 0.05);
    }
  }

  function sfx(kind) {
    ensureAudio().then(() => {
      startAmbient();
      if (muted && kind !== 'click') return;
      const map = {
        hit: 'hit',
        slash: 'slash',
        heavy: 'heavy',
        fireball: 'fireball',
        explode: 'explode',
        ok: 'ok',
        perfect: 'perfect',
        bad: 'bad',
        fever: 'fever',
        boss: 'boss',
        win: 'win',
        lose: 'lose',
        tick: 'tick',
        tickUrgent: 'tickUrgent',
        hoof: 'hoof',
        click: 'click',
        start: 'start'
      };
      const file = map[kind] || kind;
      const gains = {
        ambient: 0.22,
        slash: 0.85,
        hit: 0.9,
        heavy: 1,
        fireball: 0.85,
        explode: 1,
        perfect: 0.8,
        fever: 0.75,
        boss: 0.9,
        hoof: 0.55,
        tick: 0.4,
        tickUrgent: 0.55,
        click: 0.45
      };
      if (!playBuf(file, { gain: gains[file] != null ? gains[file] : 0.8 })) {
        sfxFallback(kind);
      }
    });
  }

  document.getElementById('muteBtn')?.addEventListener('click', () => {
    ensureAudio().then(() => {
      setMuted(!muted);
      if (!muted) startAmbient();
      else if (ambientSrc) {
        try {
          ambientSrc.stop();
        } catch (_) {}
        ambientSrc = null;
        ambientGain = null;
      }
    });
  });
  setMuted(muted);

  function isDocFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function syncFsBtn() {
    const b = document.getElementById('fsBtn');
    if (b) b.textContent = isDocFullscreen() ? 'SALIR FS' : 'PANTALLA';
  }
  async function toggleGameFullscreen() {
    try {
      if (isDocFullscreen()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) await exit.call(document);
      } else {
        const root = document.documentElement;
        const req = root.requestFullscreen || root.webkitRequestFullscreen;
        if (req) await req.call(root);
        else if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'knight-request-fullscreen' }, '*');
        }
      }
    } catch (_) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'knight-request-fullscreen' }, '*');
      }
    }
    setTimeout(syncFsBtn, 80);
  }
  document.getElementById('fsBtn')?.addEventListener('click', toggleGameFullscreen);
  document.addEventListener('fullscreenchange', syncFsBtn);
  document.addEventListener('webkitfullscreenchange', syncFsBtn);
  syncFsBtn();
  window.addEventListener('message', (ev) => {
    if (ev?.data?.type === 'knight-fs-changed') syncFsBtn();
  });

  // ── QUESTIONS (shared bank: linkers / tenses / phrasals, random rotate) ──
  const quizRotator =
    typeof InfinityQuizBank !== 'undefined'
      ? InfinityQuizBank.createRotator({ flavor: 'knight', cats: ['linker', 'tense', 'phrasal', 'mixed'] })
      : null;
  const QUESTIONS_FALLBACK = [
    { prompt: '[LINKER] El cliente llama molesto. ___ , quiero ayudarte.', correct: 'however', wrong: ['idk', 'like', 'um...'], cat: 'linker' }
  ];
  function nextQuestion() {
    if (quizRotator) return quizRotator.next();
    return QUESTIONS_FALLBACK[0];

  function roundRect(c, x, y, w, h, r) {
    if (!(w > 0) || !(h > 0)) return;
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  // ── KNIGHT ──
  const knight = {
    x: 0,

    anim: 'idle',

    tick: 0,
    hp: 3,
    maxHp: 3,
    score: 0,
    streak: 0,

    invincible: 0,
    lunge: 0,
    draw() {
      let key = this.anim;
      if (mounted && (key === 'idle' || key === 'idle_b')) key = 'horse_idle';
      const a = ANIMS[key];
      const img = imgs[key];
      if (!a || !img?.complete) return;
      const f = Math.floor(this.frame) % a.frames;
      const scale = (H() * (mounted ? 0.54 : 0.48)) / FRAME.h;
      const dw = FRAME.w * scale;
      const dh = FRAME.h * scale;
      const ox = this.lunge;
      ctx.save();
      // ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.ellipse(this.x + ox, this.y + 4, dw * 0.28, dh * 0.04, 0, 0, Math.PI * 2);
      ctx.fill();
      if (this.invincible > 0 && Math.floor(this.invincible / 3) % 2 === 0) ctx.globalAlpha = 0.35;
      if (fever > 70) {
        ctx.shadowColor = '#E8C547';
        ctx.shadowBlur = 18;
      }
      ctx.drawImage(img, f * FRAME.w, 0, FRAME.w, FRAME.h, this.x + ox - dw / 2, this.y - dh, dw, dh);
      ctx.restore();
    },
    update() {
      if (this.lunge > 0) this.lunge *= 0.82;
      const key =
        mounted && (this.anim === 'idle' || this.anim === 'idle_b') ? 'horse_idle' : this.anim;
      const a = ANIMS[key];
      if (!a) return;
      this.tick++;
      if (this.tick >= 60 / a.fps) {
        this.tick = 0;
        this.frame++;
        const done = this.frame >= a.frames;
        if (done) {
          if (['attack', 'attack_b', 'attack_c', 'attack_d', 'attack_e', 'kick', 'air_a', 'air_b', 'fireball', 'run_attack', 'horse_atk', 'horse_atk_b', 'arrow', 'throw', 'dash', 'dash_back', 'roll', 'slide', 'jump', 'duck', 'suspicious', 'shield', 'block'].includes(this.state)) {
            this.state = 'idle';

            quizOnActionDone();

            this.state = 'idle';
            this.setAnim(fever < 30 && Math.random() > 0.6 ? 'hurt_idle' : 'idle');

          } else if (this.state === 'die') {
            this.frame = a.frames - 1;
          } else if (this.state === 'win' || this.state === 'greet' || this.state === 'guard') {
            if (this.state === 'greet' || this.state === 'guard') {
              this.state = 'idle';
              this.setAnim('idle');
            } else this.frame = 0;
          } else if (this.state === 'block') {
            this.state = 'idle';
            this.setAnim('idle');
          } else this.frame = 0;
        }
      }
      if (this.invincible > 0) this.invincible--;
    },
    setAnim(name, force) {
      if (!ANIMS[name] || !imgs[name]?.complete) name = 'idle';
      if (this.anim === name && !force) return;
      this.anim = name;
      this.frame = 0;
      this.tick = 0;
    },
    pickAttack() {
      if (mounted) return Math.random() > 0.5 ? 'horse_atk' : 'horse_atk_b';
      if (fever >= 85) return ['fireball', 'attack_e', 'arrow', 'throw'][(Math.random() * 4) | 0];
      if (knight.streak >= 6) return ['attack_c', 'attack_d', 'air_a', 'air_b', 'kick', 'run_attack', 'slide'][(Math.random() * 7) | 0];
      if (knight.streak >= 3) return ['attack_b', 'attack_c', 'kick', 'roll', 'jump'][(Math.random() * 5) | 0];
      return Math.random() > 0.5 ? 'attack' : 'attack_b';

    doAttack(perfect) {
      if (this.state === 'die') return;
      const atk = this.pickAttack();
      this.state = atk;
      this.setAnim(atk, true);
      this.lunge = W() * 0.08;
      const ex = this.x + W() * 0.18;
      const ey = this.y - H() * 0.28;

      } else if (atk.includes('horse')) {

    doHurt() {
      if (this.state === 'die') return;

  // ── ENEMY ──
  class Enemy {
    constructor(type) {
      this.type = type;
      this.skel = type.skel || 'skel01';
      this.x = W() * 0.74;
      this.y = H() * 0.72;
      this.w = H() * (type.boss ? 0.34 : 0.28);
      this.h = H() * (type.boss ? 0.38 : 0.32);
      this.hp = type.hp;
      this.maxHp = type.hp;
      this.shaking = 0;
      this.dead = false;
      this.alpha = 1;
      this.particles = [];
      this.anim = 'idle';
      this.frame = 0;
      this.animT = 0;
      this.fps = type.boss ? 11 : 10;
      this.animOnce = false;
      this.fadeAfterDead = false;
    }
    framesFor(anim) {
      const pack = enemyImgs[this.skel];
      if (!pack) return null;
      const frames = pack[anim];
      if (!frames || !frames.length) return null;
      const ready = frames.filter((img) => img && img.complete && img.naturalWidth > 0);
      return ready.length ? ready : null;
    }
    setAnim(name, once) {
      if (this.anim === name && !once) return;
      this.anim = name;
      this.frame = 0;
      this.animT = 0;
      this.animOnce = !!once;
    }
    draw() {
      if (this.dead && this.alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = this.alpha;
      const sk = this.shaking > 0 ? Math.sin(this.shaking * 0.9) * 7 : 0;
      const x = this.x + sk;
      const bob = this.dead ? 0 : Math.sin(frameCount * 0.05) * 3;
      const y = this.y + bob;

      ctx.fillStyle = 'rgba(0,0,0,0.28)';
      ctx.beginPath();
      ctx.ellipse(x, y + 4, this.w * 0.32, this.h * 0.035, 0, 0, Math.PI * 2);
      ctx.fill();

      const frames = this.framesFor(this.anim) || this.framesFor('idle');
      if (frames) {
        const img = frames[Math.min(this.frame, frames.length - 1)];
        const dw = this.w;
        const dh = this.h;
        ctx.save();
        // Face the knight (left)
        ctx.translate(x, y);
        ctx.scale(-1, 1);
        if (this.type.boss) {
          ctx.shadowColor = '#E8C547';
          ctx.shadowBlur = 18;
        }
        ctx.drawImage(img, -dw / 2, -dh * 0.92, dw, dh);
        ctx.restore();
      } else {
        this.drawSkelFallback(x, y);
      }

      // Compact HP + wrong-word chip glued above the head (no mid-stage float)
      const headY = y - this.h * 0.92;
      const bw = Math.min(this.w * 0.9, W() * 0.2),
        bh = 5;
      const hpY = headY - bh - 6;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      roundRect(ctx, x - bw / 2, hpY, bw, bh, 3);
      ctx.fill();
      ctx.fillStyle = this.type.boss ? '#E8C547' : '#ef4444';
      roundRect(ctx, x - bw / 2, hpY, bw * (this.hp / this.maxHp), bh, 3);
      ctx.fill();

      const word = this.type.wrongWord || '';
      ctx.font = `bold ${Math.max(10, H() * 0.017)}px monospace`;
      const labelH = Math.max(14, H() * 0.026);
      const labelW = Math.min(this.w * 1.0, Math.max(bw, ctx.measureText(word).width + 12));
      const labelY = hpY - labelH - 4;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      roundRect(ctx, x - labelW / 2, labelY, labelW, labelH, 4);
      ctx.fill();
      ctx.strokeStyle = this.type.color;
      ctx.lineWidth = 1.2;
      roundRect(ctx, x - labelW / 2, labelY, labelW, labelH, 4);
      ctx.stroke();
      ctx.fillStyle = '#fecaca';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(word, x, labelY + labelH / 2);

      if (this.type.boss) {
        ctx.fillStyle = '#E8C547';
        ctx.font = `900 ${H() * 0.016}px Cinzel,serif`;
        ctx.textAlign = 'center';
        ctx.fillText('BOSS', x, labelY - 8);
      }

      this.particles.forEach((p) => {
        const rad = Math.max(0.1, (p.r || 2) * Math.max(0, p.life));
        ctx.globalAlpha = Math.max(0, p.life) * this.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }
    drawSkelFallback(x, y) {
      ctx.strokeStyle = '#f1f5f9';
      ctx.fillStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y - this.h * 0.35, this.w * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(x - 8, y - this.h * 0.38, 5, 7, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 8, y - this.h * 0.38, 5, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.moveTo(x, y - this.h * 0.15);
      ctx.lineTo(x, y + this.h * 0.05);
      ctx.stroke();
    }
    update() {
      if (this.shaking > 0) this.shaking--;
      const frames = this.framesFor(this.anim);
      const n = frames ? frames.length : ENEMY_FRAMES;
      this.animT++;
      if (this.animT >= Math.max(2, Math.round(60 / this.fps))) {
        this.animT = 0;
        if (this.animOnce) {
          if (this.frame < n - 1) this.frame++;
          else if (this.anim === 'dead') this.fadeAfterDead = true;
          else if (this.anim === 'hurt' || this.anim === 'attack') {
            if (!this.dead) this.setAnim('idle');
          }
        } else {
          this.frame = (this.frame + 1) % n;
        }
      }
      if (this.dead && this.fadeAfterDead) this.alpha -= 0.04;
      else if (this.dead && !frames) this.alpha -= 0.03;

      if (!this.dead && this.anim === 'idle' && Math.random() < 0.003) {
        this.setAnim('attack', true);
      }

      this.particles = this.particles.filter((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.15;
        p.life -= 0.035;
        return p.life > 0;
      });
    }
    hit(dmg) {
      this.hp -= dmg;
      this.shaking = 16;
      for (let i = 0; i < 16; i++) {
        this.particles.push({
          x: this.x,
          y: this.y - this.h * 0.35,
          vx: (Math.random() - 0.5) * 7,
          vy: -Math.random() * 5,
          color: this.type.color,
          r: 3 + Math.random() * 4,
          life: 1
        });
      }
      if (this.hp <= 0) {
        this.dead = true;
        this.setAnim('dead', true);
        spawnFx('explosion', this.x, this.y - this.h * 0.3, this.type.boss ? 1.5 : 1.1);
        spawnFx('slam', this.x, this.y + 10, 1);
        burst(this.x, this.y - this.h * 0.3, this.type.color, 24);
        return true;
      }
      this.setAnim('hurt', true);
      return false;
    }
  }

  // ── BACKGROUND HIGH-END ──
  function drawBG() {
    const w = W(),
      h = H(),
      t = frameCount;
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#05040a');
    sky.addColorStop(0.35, '#1a0f18');
    sky.addColorStop(0.65, '#2a1830');
    sky.addColorStop(1, '#1a2a1a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // moon + rays
    const mx = w * 0.82,
      my = h * 0.14,
      mr = h * 0.075;
    const glow = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 4);
    glow.addColorStop(0, 'rgba(253,230,138,0.35)');
    glow.addColorStop(0.4, 'rgba(232,197,71,0.1)');
    glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(mx, my, mr * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff7ed';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a0f18';
    ctx.beginPath();
    ctx.arc(mx + mr * 0.35, my - mr * 0.12, mr * 0.85, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.globalAlpha = 0.08;
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = '#F5E6A3';
      ctx.beginPath();
      ctx.moveTo(mx, my);
      ctx.arc(mx, my, h * 0.7, -0.9 + i * 0.12, -0.82 + i * 0.12);
      ctx.fill();
    }
    ctx.restore();

    // stars
    for (let i = 0; i < 70; i++) {
      const sx = ((i * 97) % 100) / 100,
        sy = ((i * 53) % 50) / 100;
      const tw = 0.3 + 0.7 * ((Math.sin(t * 0.05 + i) + 1) / 2);
      ctx.globalAlpha = 0.2 + tw * 0.8;
      ctx.fillStyle = i % 6 === 0 ? '#E8C547' : '#fff';
      ctx.fillRect(w * sx, h * sy * 0.5, tw > 0.8 ? 2 : 1, tw > 0.8 ? 2 : 1);
    }
    ctx.globalAlpha = 1;

    const scroll = (bgScroll * 0.2) % w;
    // far ruins
    ctx.fillStyle = '#120c18';
    for (let i = 0; i < 8; i++) {
      const bx = ((i * 140 - scroll * 0.3) % (w + 160)) - 40;
      const bh = 40 + ((i * 37) % 80);
      ctx.fillRect(bx, h * 0.55 - bh, 28 + (i % 3) * 10, bh);
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(232,197,71,0.25)';
        ctx.fillRect(bx + 8, h * 0.55 - bh + 16, 6, 8);
        ctx.fillStyle = '#120c18';
      }
    }

    drawCastle(w * 0.58, h * 0.28, w * 0.4, h * 0.54, 0.7);
    drawCemetery(w * 0.01, h * 0.52, w * 0.38, h * 0.3, t);
    drawCastle(w * 0.02, h * 0.4, w * 0.24, h * 0.42, 0.95);

    // fog
    const fog = ctx.createLinearGradient(0, h * 0.5, 0, h * 0.82);
    fog.addColorStop(0, 'rgba(148,163,184,0)');
    fog.addColorStop(0.5, 'rgba(148,163,184,0.1)');
    fog.addColorStop(1, 'rgba(15,10,20,0.35)');
    ctx.fillStyle = fog;
    ctx.fillRect(0, h * 0.5, w, h * 0.35);

    // ground
    const ground = ctx.createLinearGradient(0, h * 0.78, 0, h);
    ground.addColorStop(0, '#14532d');
    ground.addColorStop(0.4, '#166534');
    ground.addColorStop(1, '#052e16');
    ctx.fillStyle = ground;
    ctx.fillRect(0, h * 0.82, w, h * 0.18);

    // arena stone
    const fy = h * 0.775,
      fh = h * 0.07;
    const stone = ctx.createLinearGradient(0, fy, 0, fy + fh);
    stone.addColorStop(0, '#9ca3af');
    stone.addColorStop(0.4, '#6b7280');
    stone.addColorStop(1, '#374151');
    ctx.fillStyle = stone;
    roundRect(ctx, w * 0.05, fy, w * 0.9, fh, 8);
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,197,71,0.25)';
    ctx.lineWidth = 2;
    roundRect(ctx, w * 0.05, fy, w * 0.9, fh, 8);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    for (let i = 1; i < 10; i++) {
      const sx = w * 0.05 + i * ((w * 0.9) / 10);
      ctx.beginPath();
      ctx.moveTo(sx, fy + 3);
      ctx.lineTo(sx, fy + fh - 3);
      ctx.stroke();
    }

    // torches
    drawTorch(w * 0.09, fy, t);
    drawTorch(w * 0.91, fy, t);

    // ember particles ambient
    ctx.fillStyle = 'rgba(251,146,60,0.7)';
    for (let i = 0; i < 18; i++) {
      const ex = ((i * 89 + t * (0.4 + (i % 3) * 0.2)) % w);
      const ey = h * 0.35 + ((i * 47 + t) % (h * 0.45));
      ctx.globalAlpha = 0.25 + 0.5 * Math.sin(t * 0.1 + i);
      ctx.beginPath();
      ctx.arc(ex, ey, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (fever > 60) {
      const feverGlow = ctx.createRadialGradient(w * 0.25, h * 0.7, 0, w * 0.25, h * 0.7, w * 0.4);
      feverGlow.addColorStop(0, 'rgba(232,197,71,0.12)');
      feverGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = feverGlow;
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawCastle(x, y, cw, ch, a) {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = '#1f1830';
    ctx.fillRect(x + cw * 0.28, y + ch * 0.2, cw * 0.44, ch * 0.8);
    ctx.fillStyle = '#151022';
    ctx.fillRect(x, y + ch * 0.32, cw * 0.22, ch * 0.68);
    ctx.fillRect(x + cw * 0.78, y + ch * 0.28, cw * 0.22, ch * 0.72);
    ctx.fillStyle = '#2a2244';
    for (let i = 0; i < 9; i++) if (i % 2 === 0) ctx.fillRect(x + cw * 0.28 + i * cw * 0.05, y + ch * 0.12, cw * 0.04, ch * 0.1);
    ctx.fillStyle = '#07050c';
    ctx.beginPath();
    ctx.moveTo(x + cw * 0.4, y + ch);
    ctx.lineTo(x + cw * 0.4, y + ch * 0.6);
    ctx.quadraticCurveTo(x + cw * 0.5, y + ch * 0.45, x + cw * 0.6, y + ch * 0.6);
    ctx.lineTo(x + cw * 0.6, y + ch);
    ctx.fill();
    [
      [0.36, 0.35],
      [0.52, 0.35],
      [0.44, 0.5],
      [0.08, 0.45],
      [0.86, 0.42]
    ].forEach(([wx, wy], i) => {
      ctx.fillStyle = `rgba(232,197,71,${0.35 + 0.45 * Math.sin(frameCount * 0.12 + i)})`;
      ctx.fillRect(x + cw * wx, y + ch * wy, cw * 0.055, ch * 0.07);
    });
    ctx.fillStyle = '#B91C1C';
    ctx.fillRect(x + cw * 0.48, y + ch * 0.22, cw * 0.035, ch * 0.2);
    const wave = Math.sin(frameCount * 0.08) * cw * 0.02;
    ctx.beginPath();
    ctx.moveTo(x + cw * 0.515, y + ch * 0.22);
    ctx.lineTo(x + cw * 0.7 + wave, y + ch * 0.28);
    ctx.lineTo(x + cw * 0.515, y + ch * 0.34);
    ctx.fill();
    ctx.restore();
  }

  function drawCemetery(x, y, cw, ch, t) {
    ctx.save();
    // fence
    ctx.strokeStyle = '#3f3f46';
    ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) {
      const fx = x + (cw * i) / 11;
      ctx.beginPath();
      ctx.moveTo(fx, y + ch * 0.7);
      ctx.lineTo(fx, y + ch * 0.95);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(fx, y + ch * 0.7);
      ctx.lineTo(fx + 3, y + ch * 0.62);
      ctx.lineTo(fx + 6, y + ch * 0.7);
      ctx.stroke();
    }
    [
      [0.2, 0.35],
      [0.4, 0.4],
      [0.58, 0.32],
      [0.75, 0.45]
    ].forEach(([gx, gy], i) => {
      const sx = x + cw * gx,
        sy = y + ch * gy,
        gw = cw * 0.1,
        gh = ch * 0.4;
      ctx.fillStyle = i % 2 ? '#52525b' : '#3f3f46';
      ctx.beginPath();
      ctx.moveTo(sx, sy + gh);
      ctx.lineTo(sx, sy + gh * 0.32);
      ctx.quadraticCurveTo(sx + gw / 2, sy, sx + gw, sy + gh * 0.32);
      ctx.lineTo(sx + gw, sy + gh);
      ctx.fill();
      ctx.fillStyle = '#a1a1aa';
      ctx.fillRect(sx + gw * 0.4, sy + gh * 0.25, gw * 0.2, gh * 0.3);
      ctx.fillRect(sx + gw * 0.2, sy + gh * 0.34, gw * 0.6, gh * 0.1);
    });
    for (let i = 0; i < 6; i++) {
      const wx = x + cw * (0.15 + i * 0.14) + Math.sin(t * 0.04 + i) * 10;
      const wy = y + ch * 0.25 + Math.cos(t * 0.05 + i) * 12;
      ctx.fillStyle = `rgba(196,181,253,${0.12 + 0.18 * Math.sin(t * 0.06 + i)})`;
      ctx.beginPath();
      ctx.ellipse(wx, wy, 7, 12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawTorch(x, y, t) {
    ctx.fillStyle = '#44403c';
    ctx.fillRect(x - 3, y - 22, 6, 22);
    const fl = 0.7 + 0.3 * Math.sin(t * 0.4 + x);
    const g = ctx.createRadialGradient(x, y - 28, 1, x, y - 28, 20 * fl);
    g.addColorStop(0, '#fff7ed');
    g.addColorStop(0.35, '#fb923c');
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - 28, 20 * fl, 0, Math.PI * 2);
    ctx.fill();
  }

  // ── GAME FLOW ──
  function questionTimer() {
    const n = questionsAnswered || 0;
    if (n >= 20) return 3;
    if (n >= 15) return 6;
    if (n >= 10) return 8;
    return 10;
  }

  function fitOptionText(text, maxW, basePx) {
    let size = basePx;
    ctx.font = `800 ${size}px monospace`;
    while (size > 9 && ctx.measureText(text).width > maxW) {
      size -= 1;
      ctx.font = `800 ${size}px monospace`;
    }
    return size;
  }

  function uiReady(img) {
    return img && img.complete && img.naturalWidth > 0;
  }

  function drawNine(img, x, y, w, h, slice) {
    if (!uiReady(img)) {
      ctx.fillStyle = '#f3e0b8';
      roundRect(ctx, x, y, w, h, 10);
      ctx.fill();
      ctx.strokeStyle = '#5c3a1e';
      ctx.lineWidth = 3;
      roundRect(ctx, x, y, w, h, 10);
      ctx.stroke();
      return;
    }
    const iw = img.naturalWidth;
    const ih = img.naturalHeight;
    const s = Math.min(slice || 10, Math.floor(iw / 3), Math.floor(ih / 3));
    const dw = Math.max(s * 2 + 1, w);
    const dh = Math.max(s * 2 + 1, h);
    const mw = iw - s * 2;
    const mh = ih - s * 2;
    const dwm = dw - s * 2;
    const dhm = dh - s * 2;
    // corners
    ctx.drawImage(img, 0, 0, s, s, x, y, s, s);
    ctx.drawImage(img, iw - s, 0, s, s, x + dw - s, y, s, s);
    ctx.drawImage(img, 0, ih - s, s, s, x, y + dh - s, s, s);
    ctx.drawImage(img, iw - s, ih - s, s, s, x + dw - s, y + dh - s, s, s);
    // edges
    if (dwm > 0) {
      ctx.drawImage(img, s, 0, mw, s, x + s, y, dwm, s);
      ctx.drawImage(img, s, ih - s, mw, s, x + s, y + dh - s, dwm, s);
    }
    if (dhm > 0) {
      ctx.drawImage(img, 0, s, s, mh, x, y + s, s, dhm);
      ctx.drawImage(img, iw - s, s, s, mh, x + dw - s, y + s, s, dhm);
    }
    if (dwm > 0 && dhm > 0) ctx.drawImage(img, s, s, mw, mh, x + s, y + s, dwm, dhm);
  }

  function drawHRibbon(L, M, R, x, y, w, h) {
    if (!uiReady(L) || !uiReady(M) || !uiReady(R)) {
      ctx.fillStyle = '#c0392b';
      roundRect(ctx, x, y, w, h, 6);
      ctx.fill();
      return;
    }
    const endW = Math.min(Math.max(h * 0.85, 18), w * 0.28);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(L, x, y, endW, h);
    ctx.drawImage(R, x + w - endW, y, endW, h);
    const mid = Math.max(1, w - endW * 2 + 2);
    ctx.drawImage(M, x + endW - 1, y, mid, h);
    ctx.imageSmoothingEnabled = true;
  }

  function wrapPrompt(text, maxW, font) {
    ctx.font = font;
    const words = String(text || '').split(/\s+/);
    const lines = [];
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        lines.push(line);
        line = words[i];
      } else line = test;
    }
    if (line) lines.push(line);
    return lines.length ? lines : [''];
  }

  function ensureCanvasAlive() {
    if (W() < 2 || H() < 2) {
      try {
        resize();
      } catch (_) {}
    }
    return W() >= 2 && H() >= 2;
  }

  function forceFallbackQuestion() {
    currentQ = QUESTIONS_FALLBACK[0];
    options = [
      { word: String(currentQ.correct), isCorrect: true },
      { word: 'idk', isCorrect: false },
      { word: 'like', isCorrect: false }
    ];
    timerMax = questionTimer();
    quiz.phase = 'ready';
    quiz.locked = false;
    quiz.born = performance.now();
    quiz.phaseAt = quiz.born;
    quiz.pendingKill = false;
    quiz.advancing = false;
  }

  /** Sync replace q+options in one shot → phase ready. No setTimeout path. */
  function loadNextQuestion() {
    if (gameState !== STATES.PLAY || knight.state === 'die') return;
    try {
      currentQ = nextQuestion();
      if (!currentQ || !currentQ.correct) currentQ = QUESTIONS_FALLBACK[0];
      let wrong = (currentQ.wrong || []).filter((w) => w && w !== currentQ.correct).slice(0, 2);
      while (wrong.length < 2) wrong.push(['idk', 'like', 'um...'][wrong.length]);
      options = [
        { word: String(currentQ.correct), isCorrect: true },
        ...wrong.map((w) => ({ word: String(w), isCorrect: false }))
      ];
      options.sort(() => Math.random() - 0.5);
      timerMax = questionTimer();
      quiz.phase = 'ready';
      quiz.locked = false;
      quiz.born = performance.now();
      quiz.phaseAt = quiz.born;
      quiz.pendingKill = false;
      quiz.advancing = false;
      if (!options.length) forceFallbackQuestion();
    } catch (err) {
      console.error('[KQ loadNextQuestion]', err);
      forceFallbackQuestion();
    }
  }
  const loadQuestion = loadNextQuestion;

  function endResolving(reason) {
    if (gameState !== STATES.PLAY || knight.state === 'die') return;
    if (quiz.phase !== 'resolving' && quiz.phase !== 'advance') return;
    if (quiz.pendingKill || (enemy && enemy.dead)) {
      quiz.phase = 'advance';
      quiz.locked = true;
      quiz.phaseAt = performance.now();
      nextEnemy();
      return;
    }
    loadNextQuestion();
  }

  /** Every-frame quiz SM (runs even during hitstop). */
  function tickQuiz(now) {
    if (gameState !== STATES.PLAY || knight.state === 'die') return;

    if (!options.length || !currentQ) {
      if (enemy && enemy.dead) {
        quiz.phase = 'advance';
        quiz.phaseAt = now;
        quiz.locked = true;
        nextEnemy();
      } else {
        loadNextQuestion();
      }
      return;
    }

    if (quiz.phase === 'resolving') {
      const age = now - quiz.phaseAt;
      if (enemy && enemy.dead) quiz.pendingKill = true;
      // Same as Thief: don't wait on attack/mount anim — keep the fight moving.
      if (age >= 280) {
        endResolving(age >= 700 ? 'wall-700' : 'wall-280');
        return;
      }
      if (age >= 700) {
        endResolving('wall-700');
        return;
      }
      return;
    }

    if (quiz.phase === 'advance') {
      const age = now - quiz.phaseAt;
      if (age > 900 || !options.length || !currentQ) {
        if (!enemy || enemy.dead) nextEnemy();
        else loadNextQuestion();
      }
      return;
    }

    // ready: must stay clickable
    if (quiz.phase === 'ready' && quiz.locked) {
      quiz.locked = false;
    }
  }

  /** Options strip only — no parchment over the duel. */
  function quizDock() {
    const w = W(),
      h = H();
    const btnH = Math.max(28, Math.min(40, h * 0.055));
    const btnY = Math.min(h * 0.905, h - btnH - 8);
    return { w, h, btnY, btnH };
  }

  function drawTimer() {
    if (!currentQ || gameState !== STATES.PLAY || quiz.phase !== 'ready' || quiz.locked || knight.state === 'die')
      return;
    const left = Math.max(0, timerMax - (performance.now() - quiz.born) / 1000);
    const pct = left / timerMax;
    const secLeft = Math.ceil(left);
    if (secLeft !== lastTickSec && left > 0 && left <= 3.2) {
      lastTickSec = secLeft;
      sfx(left <= 1.6 ? 'tickUrgent' : 'tick');
    }
    if (left > 3.2) lastTickSec = -1;
    const x = W() * 0.15,
      y = H() * 0.08,
      bw = W() * 0.7,
      bh = 8;
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    roundRect(ctx, x, y, bw, bh, 4);
    ctx.fill();
    ctx.fillStyle = pct > 0.4 ? '#E8C547' : pct > 0.2 ? '#fb923c' : '#ef4444';
    roundRect(ctx, x, y, bw * pct, bh, 4);
    ctx.fill();
    if (left <= 0 && options.length && quiz.phase === 'ready' && !quiz.locked) {
      quiz.phase = 'resolving';
      quiz.locked = true;
      quiz.phaseAt = performance.now();
      quiz.pendingKill = false;
      knight.doHurt();
      sfx('bad');
      addText(W() / 2, H() * 0.4, '¡TIEMPO!', '#ef4444', 1.3);
    }
  }

  function drawQuestion() {
    if (!currentQ) return;
    // PLAY: NO parchment. One HUD line only — duel stays visible.
    const h = H(),
      w = W();
    const line = String(currentQ.prompt || '');
    const maxW = w * 0.62;
    let fs = Math.round(h * 0.022);
    ctx.font = `700 ${fs}px Outfit,sans-serif`;
    while (fs > 10 && ctx.measureText(line).width > maxW) {
      fs -= 1;
      ctx.font = `700 ${fs}px Outfit,sans-serif`;
    }
    ctx.fillStyle = 'rgba(8,6,12,0.72)';
    const tw = Math.min(maxW, ctx.measureText(line).width) + 16;
    const th = fs + 10;
    const tx = (w - tw) / 2;
    const ty = h * 0.118;
    roundRect(ctx, tx, ty, tw, th, 6);
    ctx.fill();
    ctx.fillStyle = '#fff8e7';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(line, w / 2, ty + th / 2);
  }

  function drawOptions() {
    if (!options.length) return;
    const { w, h, btnY, btnH } = quizDock();
    const gap = 8;
    const btnW = Math.min(w * 0.28, (w - gap * (options.length + 1)) / options.length);
    const startX = (w - options.length * btnW - (options.length - 1) * gap) / 2;
    const locked = quiz.locked || quiz.phase !== 'ready';
    if (locked) ctx.globalAlpha = 0.5;
    options.forEach((opt, i) => {
      const x = startX + i * (btnW + gap);
      const hover =
        !locked && mouseX > x && mouseX < x + btnW && mouseY > btnY && mouseY < btnY + btnH;
      drawHRibbon(ui.btnL || ui.bannerL, ui.btnM || ui.bannerM, ui.btnR || ui.bannerR, x, btnY, btnW, btnH);
      if (hover) {
        ctx.fillStyle = 'rgba(255,230,150,0.22)';
        roundRect(ctx, x + 3, btnY + 2, btnW - 6, btnH - 4, 3);
        ctx.fill();
        ctx.strokeStyle = '#F5E6A3';
        ctx.lineWidth = 2;
        roundRect(ctx, x + 1, btnY + 1, btnW - 2, btnH - 2, 4);
        ctx.stroke();
      }
      ctx.fillStyle = '#fff';
      const fs = fitOptionText(opt.word, btnW * 0.84, h * 0.022);
      ctx.font = `800 ${fs}px monospace`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.55)';
      ctx.shadowBlur = 3;
      ctx.fillText(opt.word, x + btnW / 2, btnY + btnH / 2 + 1);
      ctx.shadowBlur = 0;
      opt.rect = { x, y: btnY, w: btnW, h: btnH };
    });
    if (locked) ctx.globalAlpha = 1;
  }

  function answer(opt) {
    if (
      gameState !== STATES.PLAY ||
      knight.state === 'die' ||
      quiz.phase !== 'ready' ||
      quiz.locked ||
      !options.length ||
      !enemy ||
      !opt
    )
      return;
    const elapsed = (performance.now() - quiz.born) / 1000;
    const perfect = elapsed <= 2.2;
    const fast = elapsed <= 4;
    // resolving: options stay visible+dim; damage/score NOW; never clear options[].
    quiz.phase = 'resolving';
    quiz.locked = true;
    quiz.phaseAt = performance.now();
    quiz.pendingKill = false;
    if (opt.isCorrect) {
      const m = mult();
      let gain = (enemy.type.xp || 100) + knight.streak * 15;
      if (perfect) gain = Math.round(gain * 1.75);
      else if (fast) gain = Math.round(gain * 1.25);
      gain *= m;
      knight.score += gain;
      knight.streak++;
      fever = Math.min(feverMax(), fever + (perfect ? 22 : 14));
      if (fever >= 100 && !mounted) {
        mounted = true;
        toast('MONTURA. Ahora duele.', 1200);
        sfx('fever');
        spawnFx('smoke_up', knight.x, knight.y - 30, 1.2);
        // don't setAnim here — doAttack must play first so resolving can end
      }
      knight.doAttack(perfect);
      hitstop = Math.min(12, perfect ? 8 : 4);
      shake = perfect ? 12 : 7;
      const killed = enemy.hit(perfect ? 2 : 1);
      sfx(perfect ? 'perfect' : 'ok');
      sfx('hit');
      if (killed) sfx('explode');
      addText(enemy.x, enemy.y - H() * 0.18, '+' + gain, '#E8C547', perfect ? 1.35 : 1);
      addText(
        knight.x,
        knight.y - H() * 0.3,
        perfect ? 'PERFECT!' : fast ? 'GREAT!' : opt.word.toUpperCase() + '!',
        perfect ? '#F5E6A3' : '#86efac',
        1.1
      );
      if (knight.streak >= 3) toast(knight.streak + ' STREAK ×' + m, 700);
      updateHUD();
      questionsAnswered++;
      if (killed) {
        quiz.pendingKill = true;
        toast(enemy.type.boss ? 'BOSS DOWN' : 'ENEMY DOWN', 900);
      }
    } else {
      knight.doHurt();
      if (Math.random() > 0.5 && knight.state !== 'die') {
        after(400, () => {
          if (knight.state === 'idle') {
            knight.state = 'suspicious';
            knight.setAnim('suspicious', true);
          }
        });
      }
      enemy.shaking = 18;
      sfx('bad');
      addText(knight.x, knight.y - H() * 0.28, 'DUDÁ', '#ef4444', 1.2);
      addText(W() / 2, H() * 0.28, Run ? Run.mock() : '"' + opt.word + '" no conecta', '#fca5a5');
      toast(Run ? Run.mock() : 'NO ENTRA', 900);
      updateHUD();
    }
    persistKnight();
  }

  function nextEnemy() {
    if (gameState !== STATES.PLAY) return;
    if (roundCount >= 10) {
      knight.doWin();
      setState(STATES.ENDING);
      return;
    }
    // already spawned a living enemy for this advance
    if (enemy && !enemy.dead && quiz.phase === 'advance') {
      loadNextQuestion();
      return;
    }
    roundCount++;
    let type;
    if (roundCount === 5 || roundCount === 10) type = ENEMY_TYPES[5];
    else {
      const idx = Math.min(Math.floor((roundCount - 1) / 2), 4);
      type = ENEMY_TYPES[idx];
    }
    try {
      enemy = new Enemy(type);
      if (type.boss) {
        toast('⚠ BOSS ROUND', 1200);
        try {
          sfx('boss');
        } catch (_) {}
      }
    } catch (err) {
      console.error('[KQ nextEnemy]', err);
      enemy = new Enemy(ENEMY_TYPES[0]);
    }
    loadNextQuestion();
  }

  function updateHUD() {
    const set = (id, val) => {
      const el = document.getElementById(id);
      if (el) el.textContent = val;
    };
    set('scoreVal', knight.score);
    set('streakVal', knight.streak);
    set('multVal', mult());
    set('hpVal', knight.hp);
    const hpFill = document.getElementById('hpFill');
    if (hpFill) hpFill.style.width = (knight.hp / knight.maxHp) * 100 + '%';
    const feverFill = document.getElementById('feverFill');
    if (feverFill) feverFill.style.width = fever + '%';
    set('bestVal', Math.max(best, knight.score));
  }

  function persistKnight() {
    if (!Run || gameState !== STATES.PLAY || knight.state === 'die') return;
    Run.saveRun('knight', {
      hp: knight.hp,
      score: knight.score,
      streak: knight.streak,
      roundCount: roundCount,
      questionsAnswered: questionsAnswered,
      fever: fever,
      mounted: !!mounted,
      enemyHp: enemy && !enemy.dead ? enemy.hp : null
    });
  }

  function setState(s) {
    bumpFlow();
    gameState = s;
    if (s === STATES.STORY) {
      storyPage = 0;
      quiz.locked = false;
      quiz.phase = 'ready';
      knight.state = 'greet';
      knight.setAnim('greet', true);
    }
    if (s === STATES.PLAY) {
      const save = resumeFrom;
      resumeFrom = null;
      knight.hp = save && save.hp != null ? save.hp : 3;
      knight.score = save ? save.score || 0 : 0;
      knight.streak = save ? save.streak || 0 : 0;
      knight.state = 'idle';
      knight.setAnim('idle', true);
      roundCount = save ? Math.max(0, (save.roundCount || 1) - 1) : 0;
      questionsAnswered = save ? save.questionsAnswered || 0 : 0;
      fever = save ? save.fever || 0 : 0;
      mounted = !!(save && save.mounted);
      floatingTexts = [];
      fxList = [];
      particles = [];
      hitstop = 0;
      options = [];
      currentQ = null;
      enemy = null;
      quiz.phase = 'ready';
      quiz.locked = false;
      quiz.pendingKill = false;
      quiz.advancing = false;
      quiz.born = 0;
      quiz.phaseAt = 0;
      if (quizRotator) quizRotator.reset();
      nextEnemy();
      if (save && enemy && save.enemyHp != null) enemy.hp = Math.max(1, save.enemyHp);
      updateHUD();
      sfx('start');
      toast(save ? 'SEGUÍ. El turno no paró.' : (Run ? Run.challenge() : 'RETO'), 1100);
      persistKnight();
    }
    if (s === STATES.ENDING) {
      endingPage = 0;
      quiz.locked = false;
      quiz.phase = 'ready';
      options = [];
      if (Run) {
        Run.clearRun('knight');
        Run.recordFinish('knight', knight.score, knight.hp > 0);
      }
      if (knight.hp > 0) {
        knight.doWin();
      }
      sfx(knight.hp > 0 ? 'win' : 'lose');
      toast(knight.hp > 0 ? (Run ? Run.win() : 'CERRADO') : (Run ? Run.lose() : 'CAÍSTE'), 1400);
      updateHUD();
    }
    if (s === STATES.RESULTS) {
      quiz.locked = true;
      options = [];
      if (knight.score > best) {
        best = knight.score;
        localStorage.setItem('kq_best', best);
        toast('NUEVO RÉCORD. El piso tomó nota.', 1400);
      }
      updateHUD();
    }
  }

  // ── SCREENS ──
  function drawMenu() {
    drawBG();
    knight.x = W() * 0.2;
    knight.y = H() * 0.82;
    if (frameCount % 320 === 2) {
      knight.state = 'greet';
      knight.setAnim('greet');
    }
    if (frameCount % 500 === 100) {
      knight.state = 'guard';
      knight.setAnim('guard');
    }
    knight.update();
    knight.draw();

    if (cardImg.complete && cardImg.naturalWidth) {
      const cw = H() * 0.32;
      ctx.globalAlpha = 0.95;
      ctx.drawImage(cardImg, W() * 0.72 - cw / 2, H() * 0.22, cw, cw * 1.4);
      ctx.globalAlpha = 1;
    }

    const pw = W() * 0.52,
      ph = H() * 0.68;
    const px = (W() - pw) / 2,
      py = (H() - ph) / 2;
    ctx.fillStyle = 'rgba(8,5,10,0.82)';
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = 'rgba(232,197,71,0.65)';
    ctx.lineWidth = 2;
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${H() * 0.075}px Cinzel,serif`;
    ctx.fillText("KNIGHT'S", W() / 2, py + ph * 0.16);
    ctx.fillStyle = '#E8C547';
    ctx.fillText('QUEST', W() / 2, py + ph * 0.3);
    ctx.fillStyle = '#c4b5fd';
    ctx.font = `600 ${H() * 0.024}px Outfit,sans-serif`;
    ctx.fillText('Full Teutonic Arsenal · Infinity Studio', W() / 2, py + ph * 0.42);
    ctx.fillStyle = '#e2e8f0';
    ctx.font = `500 ${H() * 0.022}px Outfit,sans-serif`;
    [
      Run ? Run.rivalLine('knight') : 'A VENCER · tu último turno',
      'Rápido = PERFECT. Filler = te cortan.',
      '10 rondas. El piso no espera.',
      Run && Run.hasRun('knight') ? 'Tenés un turno abierto.' : 'Tocá. Sin muletilla.'
    ].forEach((l, i) => ctx.fillText(l, W() / 2, py + ph * 0.52 + i * H() * 0.05));

    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.1);
    ctx.fillStyle = `rgba(185,28,28,${0.85 + pulse * 0.15})`;
    ctx.shadowColor = '#E8C547';
    ctx.shadowBlur = 16 + pulse * 10;
    roundRect(ctx, W() / 2 - pw * 0.28, py + ph * 0.78, pw * 0.56, H() * 0.09, 12);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${H() * 0.036}px Cinzel,serif`;
    ctx.fillText(Run && Run.hasRun('knight') ? 'CONTINUAR' : 'RETO', W() / 2, py + ph * 0.825);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.font = `${H() * 0.02}px Outfit,sans-serif`;
    ctx.fillText((Run ? Run.rivalLine('knight') : 'Best: ' + best + ' XP'), W() / 2, py + ph * 0.93);
    const hasSave = Run && Run.hasRun('knight');
    window._kqFresh = null;
    if (hasSave) {
      const fw = pw * 0.56, fh = H() * 0.045, fx = W() / 2 - fw / 2, fy = py + ph * 0.96;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      roundRect(ctx, fx, fy, fw, fh, 8);
      ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.font = `800 ${H() * 0.018}px Outfit,sans-serif`;
      ctx.fillText('NUEVO RETO', W() / 2, fy + fh / 2);
      window._kqFresh = { x: fx, y: fy, w: fw, h: fh };
    }
  }

  function drawStoryPanel(page, hint) {
    drawBG();
    // Knight beside the scroll (left), parchment chapter on the right
    knight.x = W() * 0.16;
    knight.y = H() * 0.86;
    knight.update();
    knight.draw();

    const pw = W() * 0.64,
      ph = H() * 0.74;
    const px = W() * 0.3,
      py = (H() - ph) / 2;
    drawNine(ui.parchFancy || ui.parch, px, py, pw, ph, 14);

    const chapter = String(page.chapter || '');
    const rh = Math.max(28, H() * 0.055);
    const rw = Math.min(pw * 0.7, Math.max(160, chapter.length * H() * 0.018 + rh * 2.2));
    const rx = px + (pw - rw) / 2;
    const ry = py - rh * 0.35;
    drawHRibbon(ui.ribbonL, ui.ribbonM, ui.ribbonR, rx, ry, rw, rh);
    ctx.fillStyle = '#fff8e7';
    ctx.font = `800 ${Math.round(rh * 0.42)}px Cinzel,serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 2;
    ctx.fillText(chapter, rx + rw / 2, ry + rh / 2 + 1);
    ctx.shadowBlur = 0;

    const padX = pw * 0.1;
    const textX = px + padX;
    const maxW = pw - padX * 2;
    let titleFs = Math.round(H() * 0.048);
    const titleMin = Math.round(H() * 0.028);
    ctx.font = `900 ${titleFs}px Cinzel,serif`;
    while (titleFs > titleMin && ctx.measureText(page.title).width > maxW) {
      titleFs -= 1;
      ctx.font = `900 ${titleFs}px Cinzel,serif`;
    }
    ctx.fillStyle = '#2a1810';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(page.title, textX, py + ph * 0.2);

    const bodyFs = Math.round(H() * 0.026);
    const lineGap = H() * 0.048;
    ctx.font = `600 ${bodyFs}px Outfit,sans-serif`;
    ctx.fillStyle = '#3b2415';
    let bodyY = py + ph * 0.34;
    const bodyBottom = py + ph * 0.78;
    (page.lines || []).forEach((raw) => {
      if (bodyY > bodyBottom) return;
      const line = String(raw || '');
      if (!line.trim()) {
        bodyY += lineGap * 0.45;
        return;
      }
      const wrapped = wrapPrompt(line, maxW, `600 ${bodyFs}px Outfit,sans-serif`);
      wrapped.forEach((wl) => {
        if (bodyY > bodyBottom) return;
        ctx.fillText(wl, textX, bodyY);
        bodyY += lineGap;
      });
    });

    const hintText = hint || 'Tocá para continuar →';
    const hrH = Math.max(26, H() * 0.048);
    const hrW = Math.min(pw * 0.82, Math.max(200, hintText.length * H() * 0.014 + hrH * 2));
    const hrX = px + (pw - hrW) / 2;
    const hrY = py + ph - hrH * 0.85;
    const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.12);
    drawHRibbon(ui.ribbonL, ui.ribbonM, ui.ribbonR, hrX, hrY, hrW, hrH);
    ctx.fillStyle = `rgba(255,248,231,${0.75 + pulse * 0.25})`;
    ctx.font = `800 ${Math.round(hrH * 0.4)}px Outfit,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 2;
    ctx.fillText(hintText, hrX + hrW / 2, hrY + hrH / 2 + 1);
    ctx.shadowBlur = 0;
  }

  function drawStory() {
    const page = STORY_PAGES[storyPage] || STORY_PAGES[STORY_PAGES.length - 1];
    if (storyPage === 0 && knight.state === 'idle') {
      knight.state = 'greet';
      knight.setAnim('greet', true);
    }
    if (storyPage === 2 && frameCount % 90 === 0) {
      knight.state = 'guard';
      knight.setAnim('guard', true);
    }
    drawStoryPanel(page, storyPage >= STORY_PAGES.length - 1 ? 'Tocá para comenzar la misión' : 'Tocá para continuar →');
  }

  function drawEnding() {
    const pages = endingPages(knight.hp > 0);
    const page = pages[Math.min(endingPage, pages.length - 1)];
    drawStoryPanel(page, endingPage >= pages.length - 1 ? 'Tocá para ver resultado' : 'Tocá para continuar →');
  }

  function drawPlay() {
    drawBG();
    knight.x = W() * 0.24;
    knight.y = H() * 0.72;
    if (enemy) {
      enemy.x = W() * 0.74;
      enemy.y = H() * 0.72;
      enemy.draw();
    }
    knight.draw();

    // FX
    fxList = fxList.filter((fx) => {
      fx.tick++;
      if (fx.tick >= 3) {
        fx.tick = 0;
        fx.frame++;
      }
      const img = vfxImgs[fx.kind]?.[fx.frame];
      if (img) {
        const s = Math.max(4, H() * 0.24 * Math.abs(fx.scale || 1));
        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(fx.rot || 0);
        ctx.drawImage(img, -s / 2, -s / 2, s, s);
        ctx.restore();
      }
      return fx.frame < (vfxImgs[fx.kind]?.length || 0);
    });

    particles = particles.filter((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.life -= 0.025;
      if (p.life <= 0) return false;
      const rad = Math.max(0.1, Math.abs(p.r || 2) * p.life);
      try {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
        ctx.fill();
      } catch (_) {}
      ctx.globalAlpha = 1;
      return true;
    });

    floatingTexts = floatingTexts.filter((t) => {
      t.y += t.vy;
      t.vy *= 0.96;
      t.life -= 0.018;
      ctx.save();
      ctx.globalAlpha = t.life;
      ctx.font = `900 ${H() * 0.038 * (t.size || 1)}px Cinzel,serif`;
      ctx.fillStyle = t.color;
      ctx.textAlign = 'center';
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 10;
      ctx.fillText(t.text, t.x, t.y);
      ctx.restore();
      return t.life > 0;
    });

    drawTimer();
    drawQuestion();
    drawOptions();

    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.font = `${H() * 0.022}px Outfit,sans-serif`;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText(`Ronda ${roundCount}/10`, W() - 16, 12);
    if (enemy) {
      ctx.textAlign = 'left';
      ctx.fillStyle = enemy.type.boss ? '#E8C547' : 'rgba(255,255,255,0.5)';
      ctx.fillText(enemy.type.name, 16, 12);
    }
    if (mounted) {
      ctx.textAlign = 'center';
      ctx.fillStyle = '#E8C547';
      ctx.font = `900 ${H() * 0.028}px Cinzel,serif`;
      ctx.fillText('FEVER MOUNT', W() / 2, H() * 0.13);
      if (frameCount % 18 === 0) sfx('hoof');
    }
  }

  function drawResults() {
    drawBG();
    knight.x = W() * 0.5;
    knight.y = H() * 0.82;
    knight.update();
    knight.draw();
    const won = knight.hp > 0;
    const pw = W() * 0.6,
      ph = H() * 0.7;
    const px = (W() - pw) / 2,
      py = (H() - ph) / 2;
    ctx.fillStyle = 'rgba(0,0,0,0.88)';
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.fill();
    ctx.strokeStyle = won ? 'rgba(232,197,71,0.7)' : 'rgba(239,68,68,0.6)';
    ctx.lineWidth = 2;
    roundRect(ctx, px, py, pw, ph, 16);
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = won ? '#E8C547' : '#ef4444';
    ctx.font = `900 ${H() * 0.07}px Cinzel,serif`;
    ctx.fillText(won ? 'VICTORIA' : 'CAÍDA', W() / 2, py + ph * 0.22);
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${H() * 0.09}px Outfit,sans-serif`;
    ctx.fillText(knight.score + ' XP', W() / 2, py + ph * 0.42);
    ctx.fillStyle = '#94a3b8';
    ctx.font = `${H() * 0.028}px Outfit,sans-serif`;
    ctx.fillText(`Rondas ${roundCount} · Max racha ${knight.streak} · Best ${best}`, W() / 2, py + ph * 0.56);
    const bw = pw * 0.36,
      bh = H() * 0.09,
      by = py + ph * 0.7;
    ctx.fillStyle = '#B91C1C';
    roundRect(ctx, W() / 2 - bw - 10, by, bw, bh, 10);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${H() * 0.032}px Cinzel,serif`;
    ctx.fillText('OTRA', W() / 2 - bw / 2 - 10, by + bh / 2);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    roundRect(ctx, W() / 2 + 10, by, bw, bh, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('MENÚ', W() / 2 + 10 + bw / 2, by + bh / 2);
    window._retryBtn = { x: W() / 2 - bw - 10, y: by, w: bw, h: bh };
    window._menuBtn = { x: W() / 2 + 10, y: by, w: bw, h: bh };
  }

  // ── INPUT ──
  function pointerPos(e) {
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return { x: 0, y: 0 };
    const src = e.changedTouches ? e.changedTouches[0] : e.touches ? e.touches[0] : e;
    return { x: ((src.clientX - r.left) / r.width) * W(), y: ((src.clientY - r.top) / r.height) * H() };
  }
  canvas.addEventListener('mousemove', (e) => {
    const p = pointerPos(e);
    mouseX = p.x;
    mouseY = p.y;
  });
  let lastTapAt = 0;
  function tap(e) {
    if (e.cancelable) e.preventDefault();
    const now = performance.now();
    if (now - lastTapAt < 280) return;
    lastTapAt = now;
    ensureAudio();
    const p = pointerPos(e);
    mouseX = p.x;
    mouseY = p.y;
    sfx('click');
    if (gameState === STATES.MENU) {
      if (window._kqFresh && p.x > _kqFresh.x && p.x < _kqFresh.x + _kqFresh.w && p.y > _kqFresh.y && p.y < _kqFresh.y + _kqFresh.h) {
        if (Run) Run.clearRun('knight');
        resumeFrom = null;
        setState(STATES.STORY);
        return;
      }
      if (Run && Run.hasRun('knight')) {
        resumeFrom = Run.loadRun('knight');
        setState(STATES.PLAY);
        return;
      }
      setState(STATES.STORY);
      return;
    }
    if (gameState === STATES.STORY) {
      if (storyPage < STORY_PAGES.length - 1) {
        storyPage++;
        if (storyPage === 1) {
          knight.state = 'suspicious';
          knight.setAnim('suspicious', true);
        }
        if (storyPage === 2) {
          knight.state = 'guard';
          knight.setAnim('guard', true);
        }
        if (storyPage === 3) {
          knight.state = 'idle';
          knight.setAnim('idle', true);
        }
      } else setState(STATES.PLAY);
      return;
    }
    if (gameState === STATES.ENDING) {
      const pages = endingPages(knight.hp > 0);
      if (endingPage < pages.length - 1) endingPage++;
      else setState(STATES.RESULTS);
      return;
    }
    if (gameState === STATES.PLAY) {
      if (quiz.locked || quiz.phase !== 'ready' || !options.length) return;
      for (const opt of options) {
        if (opt.rect && p.x > opt.rect.x && p.x < opt.rect.x + opt.rect.w && p.y > opt.rect.y && p.y < opt.rect.y + opt.rect.h) {
          answer(opt);
          break;
        }
      }
    }
    if (gameState === STATES.RESULTS) {
      if (window._retryBtn && p.x > _retryBtn.x && p.x < _retryBtn.x + _retryBtn.w && p.y > _retryBtn.y && p.y < _retryBtn.y + _retryBtn.h) setState(STATES.STORY);
      if (window._menuBtn && p.x > _menuBtn.x && p.x < _menuBtn.x + _menuBtn.w && p.y > _menuBtn.y && p.y < _menuBtn.y + _menuBtn.h) {
        bumpFlow();
        gameState = STATES.MENU;
        knight.state = 'idle';
        knight.setAnim('idle', true);
        mounted = false;
        quiz.locked = false;
        quiz.phase = 'ready';
      }
    }
  }
  canvas.addEventListener('pointerup', tap);
  canvas.style.touchAction = 'none';

  // keyboard 1/2/3
  window.addEventListener('keydown', (e) => {
    if (gameState !== STATES.PLAY || quiz.locked || quiz.phase !== 'ready') return;
    const i = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[e.code];
    if (i != null && options[i]) answer(options[i]);
  });

  function loop() {
    requestAnimationFrame(loop);
    try {
      ensureCanvasAlive();
      // Quiz SM tick MUST run even during hitstop.
      if (gameState === STATES.PLAY && knight.state !== 'die') {
        tickQuiz(performance.now());
      }

      // Keep anim advancing during hitstop so resolving can end on anim-done.
      if (gameState === STATES.PLAY || gameState === STATES.STORY || gameState === STATES.MENU) {
        knight.update();
        if (gameState === STATES.PLAY && enemy) enemy.update();
      }
      if (hitstop > 0) hitstop = Math.max(0, (hitstop | 0) - 1);
      else {
        frameCount++;
        bgScroll++;
        if (shake > 0) shake--;
        if (flash > 0) flash--;
        fever = Math.max(0, fever - (mounted ? 0.08 : 0.02));
        if (fever < 35) mounted = false;
      }

      if (!ensureCanvasAlive()) return;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W(), H());
      // never leave a true black void if a draw throws mid-frame
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, W(), H());
      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

      if (gameState === STATES.MENU) drawMenu();
      else if (gameState === STATES.STORY) drawStory();
      else if (gameState === STATES.PLAY) drawPlay();
      else if (gameState === STATES.ENDING) drawEnding();
      else drawResults();

      if (flash > 0) {
        ctx.fillStyle = `rgba(255,220,180,${flash * 0.04})`;
        ctx.fillRect(0, 0, W(), H());
      }
      ctx.restore();
    } catch (err) {
      console.error('[KQ frame]', err);
    }
  }
  updateHUD();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) persistKnight();
    if (!document.hidden) {
      ensureCanvasAlive();
      ensureAudio().catch(() => {});
    }
  });
  window.addEventListener('pagehide', persistKnight);
  window.addEventListener('focus', () => ensureCanvasAlive());
  loop();
})().catch((err) => {
  console.error(err);
  const t = document.getElementById('load-txt');
  if (t) t.textContent = 'Error: ' + err.message + ' — recargá la página';
  const load = document.getElementById('load');
  if (load) load.classList.remove('hide');
});
</script>
</body>
</html>
